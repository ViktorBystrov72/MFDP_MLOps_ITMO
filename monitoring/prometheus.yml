global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: matching-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: matching-api

  - job_name: location-model-api
    metrics_path: /metrics
    static_configs:
      - targets: ["location_matcher:8001"]
        labels:
          service: location-model-api
